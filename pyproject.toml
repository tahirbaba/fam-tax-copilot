[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "famcheck"
version = "0.1.0"
description = "FAM Invoice Checker - UAE VAT tax-invoice compliance and e-invoicing readiness engine (EN/AR)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.8",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pypdf>=4",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "pypdfium2>=4",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
famcheck = "famcheck.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
famcheck = ["rules/packs/*.yaml", "report/templates/*", "i18n/*.json", "web/templates/*", "web/static/*", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
